name: CI

on:
  pull_request:
    branches: [master, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Incluye los tests de integración: Testcontainers usa el Docker del runner.
      - run: ./mvnw -B verify
